[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "tldhax"
requires-python = ">=3.10"
license-files = ["LICENSE", "data/psl/LICENSE", "data/NOTICES.md"]
dynamic = ["version", "description", "readme", "license", "keywords"]

[project.urls]
Homepage = "https://github.com/cmeister2/tldhax"
Repository = "https://github.com/cmeister2/tldhax"

[project.scripts]
tldhax = "tldhax.cli:main"

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff==0.15.13",
    "pytest",
    "hypothesis",
    "tomli>=2; python_version < '3.11'",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "tldhax._native"
python-source = "python"

[tool.mypy]
files = ["python", "tests/python"]
mypy_path = ["python"]

[tool.pytest.ini_options]
pythonpath = ["."]
