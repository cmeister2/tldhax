[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "tldhax"
requires-python = ">=3.10"
dynamic = ["version", "description", "readme", "keywords"]
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "data/snapshots/LICENSE.publicsuffix",
]

[project.urls]
Homepage = "https://github.com/cmeister2/tldhax"
Repository = "https://github.com/cmeister2/tldhax"

[project.scripts]
tldhax = "tldhax.cli:main"

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff==0.15.13",
    "pytest",
    "hypothesis",
]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
locked = true
module-name = "tldhax._native"
python-source = "python"

[tool.mypy]
files = ["python", "tests/python"]
mypy_path = ["python"]
