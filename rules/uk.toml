schema_version = 1

[[policies]]
id = "uk.form-1"
selector = "uk"
form = ["label"]
ascii = "supported"
idn = "unsupported"
source_notes = ["https://nominet.uk/wp-content/uploads/2025/03/UK-rules-of-registration.pdf — 1.3; 2.3; Appendix A; section 7", "https://nominet.uk/wp-content/uploads/2025/03/UK-rules-of-registration.pdf — current Rules dated 20.03.2024; the revised policy commencing February 2027 is inactive.", "https://registrars.nominet.uk/uk-namespace/registration-and-domain-management/field-definitions-and-registrant-types/ — key field, technical maximum of 63 applicant characters.", "Current Rules section 7 allows any applicant; administered/delegated namespace labels are separately reserved as namespace identities."]

[[policies.requirements]]
code = "ascii_only"
message = "This namespace currently permits only ASCII registration labels."
effect = "require"
input_class = "any"
predicate = { kind = "ascii_only", component = 0 }
source_notes = ["https://nominet.uk/wp-content/uploads/2025/03/UK-rules-of-registration.pdf — 5.2; 5.4"]

[[policies.requirements]]
code = "reserved_label"
message = "This applicant label is reserved in this UK registration namespace."
effect = "deny"
input_class = "ascii"
predicate = { kind = "label_in_set", component = 0, set_id = "nominet.root-reserved" }
source_notes = ["https://nominet.uk/wp-content/uploads/2025/03/UK-rules-of-registration.pdf — 5.6"]

[[policies.requirements]]
code = "reserved_namespace"
message = "This label identifies an administered or delegated UK registration namespace."
effect = "deny"
input_class = "ascii"
predicate = { kind = "label_in_set", component = 0, set_id = "nominet.namespace-labels" }
source_notes = ["https://nominet.uk/wp-content/uploads/2025/03/UK-rules-of-registration.pdf — Appendices A, B and C."]

[[policies.gaps]]
code = "length_policy_boundary"
message = "The current 64-character total rule and 63-character applicant-label documentation disagree for this length."
input_class = "ascii"
predicate = { kind = "not", predicate = { kind = "label_maximum", component = 0, max = 61, basis = "ascii" } }

