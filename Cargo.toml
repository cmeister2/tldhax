[package]
name = "tldhax"
version = "0.0.0"
edition = "2021"
description = "Evidence-aware domain registration assessment"
license = "MIT"
repository = "https://github.com/cmeister2/tldhax"
readme = "README.md"
keywords = ["tld", "domain", "dns", "idn", "registry"]
categories = ["command-line-utilities", "web-programming"]
include = [
    "/src/**",
    "/python/tldhax/*.py",
    "/python/tldhax/*.pyi",
    "/python/tldhax/py.typed",
    "/build.rs",
    "/data/**",
    "/docs/**",
    "/tools/update_snapshots.py",
    "/LICENSE",
    "/README.md",
    "/THIRD_PARTY_NOTICES.md",
]

[lib]
name = "tldhax"
crate-type = ["cdylib", "rlib"]

[dependencies]
idna = "1"
phf = "0.11"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }

[build-dependencies]
csv = "1"
idna = "1"
phf_codegen = "0.11"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
