[package]
name = "tldhax"
version = "0.0.0"
edition = "2021"
description = "TLD registration rule checker"
license = "MIT"
repository = "https://github.com/cmeister2/tldhax"
readme = "README.md"
keywords = ["tld", "domain", "dns", "idn", "registry"]
categories = ["command-line-utilities", "web-programming"]
include = ["src/**", "python/**", "build.rs", "build_support/**", "rules/**", "benches/**", "/LICENSE", "/README.md", "data/**"]

[lib]
name = "tldhax"
crate-type = ["cdylib", "rlib"]

[dependencies]
idna = "1.1"
icu_properties = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
idna = "1.1"
icu_properties = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints.rust]
missing_docs = "forbid"

[lints.clippy]
missing_docs_in_private_items = "forbid"
missing_errors_doc = "forbid"
missing_panics_doc = "forbid"
