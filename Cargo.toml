[package]
name = "tldhax"
version = "0.0.0"
edition = "2021"
description = "TLD registration rule checker"
license = "MIT"
repository = "https://github.com/cmeister2/tldhax"
readme = "README.md"
keywords = ["tld", "domain", "dns", "idn", "registry"]
categories = ["command-line-utilities", "web-programming"]
include = ["src/**", "python/**", "build.rs", "build_support/**", "rules/**", "evidence/**", "benches/**", "/LICENSE", "/README.md", "data/**", "scripts/data/**", "tests/compiler/**"]

[lib]
name = "tldhax"
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "lookup"
harness = false

[[bench]]
name = "assessment"
harness = false

[dependencies]
idna = "=1.1.0"
# Bind transitive normalization and data even when downstream ignores this lockfile.
idna_adapter = "=1.2.2"
icu_normalizer = { version = "=2.2.0", default-features = false }
icu_normalizer_data = "=2.2.0"
icu_properties = "=2.2.0"
icu_properties_data = "=2.2.0"
phf = "0.11"
pyo3 = { version = "0.28", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
idna = "=1.1.0"
# Bind transitive normalization and data even when downstream ignores this lockfile.
idna_adapter = "=1.2.2"
icu_normalizer = { version = "=2.2.0", default-features = false }
icu_normalizer_data = "=2.2.0"
icu_properties = "=2.2.0"
icu_properties_data = "=2.2.0"
phf_codegen = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
phf_codegen = "0.11"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[lints.rust]
missing_docs = "forbid"

[lints.clippy]
missing_docs_in_private_items = "forbid"
missing_errors_doc = "forbid"
missing_panics_doc = "forbid"
