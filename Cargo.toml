[package]
name = "tldhax"
version = "0.0.0"
edition = "2021"
description = "TLD registration rule checker"
license = "MIT"
repository = "https://github.com/cmeister2/tldhax"
readme = "README.md"
keywords = ["tld", "domain", "dns", "idn", "registry"]
categories = ["command-line-utilities", "web-programming"]
include = ["src/**", "python/**", "build.rs", "build_support/**", "rules/**", "benches/**", "/LICENSE", "/README.md", "data/**", "scripts/data/**", "tests/compiler/**"]

[lib]
name = "tldhax"
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "lookup"
harness = false

[dependencies]
idna = "=1.1.0"
icu_properties = "=2.2.0"
phf = "0.11"
psl = "2"
pyo3 = { version = "0.28", features = ["extension-module"] }
serde_json = "1"

[build-dependencies]
phf_codegen = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
